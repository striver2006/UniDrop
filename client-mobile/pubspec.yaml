name: unidrop_mobile
description: "UniClip（瞬贴）移动端：iOS / Android / 鸿蒙共享一套 Dart 代码"
publish_to: 'none'
version: 0.4.2+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  ffi: ^2.1.3
  path_provider: ^2.1.4
  device_info_plus: ^11.0.0
  connectivity_plus: ^6.0.5
  file_picker: ^10.0.0
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# 移动端图标：与 Mac 端同源（client/src-tauri/icons/icon.png 的双向传输箭头），
# 配色升级为移动图标风格（靛蓝→青渐变 + 白色箭头，与 App 主题色一致）。
# 重新生成：dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon_1024.png
  adaptive_icon_background: assets/icon/adaptive_background.png
  adaptive_icon_foreground: assets/icon/adaptive_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

