[package]
name = "unidrop-core"
description = "UniDrop platform-independent core: protocol, ARQ transfer engine, E2EE, TLS trust, SQLite storage, signal routing"
edition = "2021"
authors = ["UniDrop Team"]
license = "Apache-2.0"
version.workspace = true

# 本 crate 是桌面端（Tauri）与移动端（Flutter FFI）共享的核心，
# 不得引入任何 GUI 框架依赖（tauri / flutter-binding 等）——那是宿主壳的职责，
# 通过 host::HostBridge 注入事件与平台能力。
[lib]
name = "unidrop_core"
crate-type = ["rlib"]
[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
# 与 tokio-tungstenite 的 rustls-tls-webpki-roots feature 拉进来的是同一份。
# 显式声明是因为「信任指定证书」这一档必须自建 ClientConfig，而自建就得自己装根存储。
webpki-roots.workspace = true
# ring 本来就在依赖树里（rustls 的 ring feature），这里显式声明是为了直接用它的
# aead/hkdf。版本必须与 rustls 解析出的一致，否则依赖树会出现两份。
ring.workspace = true
# 只用于把 AEAD 密文塞进 OFFER 的 JSON 字段（encrypted_metadata）。
base64.workspace = true
uuid.workspace = true
crc32fast.workspace = true
sha2.workspace = true
rusqlite.workspace = true
hmac.workspace = true
hex.workspace = true
log.workspace = true

[dev-dependencies]
# 只为 tls_trust 的端到端分类测试而在：起一个本地自签 TLS 监听器，真握一次手，
# 验证 tokio-rustls 产出的 io::Error 确实能被本包这份 rustls downcast 回来。
rcgen = "0.14"
# 关掉默认的 aws_lc_rs，跟生产代码一样走 ring：让测试里的 provider与
# 真实运行时一致，否则测的就不是同一条路径了。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
