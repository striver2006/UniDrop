# UniDrop Relay Server Configuration Template

server:
  # HTTP & WebSocket listen address
  listen_addr: ":8080"

  # Pre-Shared Key for client authentication.
  # Recommendation: Inject via UNIDROP_PSK_SECRET environment variable in production.
  psk_secret: "YOUR_SHARED_SECRET_KEY_HERE"

  # Lightweight STUN server for NAT traversal assistance (RFC 8489)
  stun_addr: ":3478"

limits:
  # Maximum items per transfer offer
  max_items_per_offer: 1000

  # Idle timeout in seconds before closing inactive transfer pipes
  pipe_idle_timeout_seconds: 60

  # Heartbeat ping timeout in seconds
  heartbeat_timeout_seconds: 45
