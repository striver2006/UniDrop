[workspace]
resolver = "2"
members = [
    "crates/unidrop-core",
    "client/src-tauri",
    "client-mobile/native",
]

[workspace.package]
# 三端（桌面 / 移动 / 鸿蒙）共享同一版本号：
# - `unidrop_core::app_state::APP_VERSION` 取自这里，E2EE 的 peer_supports_e2ee
#   版本门槛因此天然同号；
# - 发版时与 client/package.json、client/src-tauri/tauri.conf.json 同批更新
#   （chore(release) 独立提交，不由脚本代改——既有惯例）。
version = "0.4.2"

[workspace.dependencies]
# 三 crate 共用的第三方依赖在此统一版本，防止依赖树出现两份。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
ring = "0.17"
base64 = "0.22"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
crc32fast = "1.4"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
hmac = "0.12"
hex = "0.4"
log = "0.4"
