[package]
name = "unidrop-client"
version = "0.4.0"
description = "UniDrop Cross-Platform Native Clipboard & File Distribution Client"
edition = "2021"
authors = ["UniDrop Team"]
license = "Apache-2.0"

[lib]
name = "unidrop_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# image-png 是托盘模板图所需：菜单栏图标经 Image::from_bytes 载入，而该方法被
# #[cfg(any(feature = "image-ico", feature = "image-png"))] 门控，tauri 的默认
# features 并不含它——不开这个 feature 会直接编译不过。
tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-single-instance = "2.0.0"
tauri-plugin-autostart = "2.0.0"
tauri-plugin-dialog = "2.0.0"

whoami = "1"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
# 与 tokio-tungstenite 的 rustls-tls-webpki-roots feature 拉进来的是同一份
# （lock 里 0.26.11，零新增 crate）。显式声明是因为「信任指定证书」这一档
# 必须自建 ClientConfig，而自建就得自己装根存储。
webpki-roots = "0.26"
# ring 本来就在依赖树里（rustls 的 ring feature），这里显式声明是为了直接用它的
# aead/hkdf。版本必须与 rustls 解析出的一致（当前 0.17.14），否则依赖树会出现两份。
ring = "0.17"
# 只用于把 AEAD 密文塞进 OFFER 的 JSON 字段（encrypted_metadata）。
base64 = "0.22"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
crc32fast = "1.4"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
hmac = "0.12"
hex = "0.4"
log = "0.4"
# 取代 env_logger：后者只往 stderr 写，而 GUI 双击启动时 stderr 被 launchd 收走，
# 用户报障时拿不出任何日志。插件自带轮转、保留期与各平台标准日志目录。
tauri-plugin-log = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSArray", "NSURL", "NSData"] }
objc2-app-kit = { version = "0.2", features = ["NSPasteboard", "NSPasteboardItem"] }

# 以下四项供 UNUserNotificationCenter 使用，属 objc2 0.6 那一代。
# 与上面的 0.5 并存是刻意的，不是疏漏：0.6.4 早已由 tao/dispatch2 带进 macOS
# 构建（见 Cargo.lock），两代在本 crate 内不交换任何类型——剪贴板那几个文件只碰
# 0.5，通知这个文件只碰 0.6。把剪贴板一并升到 0.6 需要改写全部 FFI
# （Id → Retained、msg_send_id! → msg_send!、declare_class! → define_class!），
# 那是给本次需求之外的稳定代码引入回归风险，收益与风险不成比例。
objc2-v06 = { package = "objc2", version = "0.6" }
objc2-foundation-v06 = { package = "objc2-foundation", version = "0.3", features = [
    "NSString",
    "NSError",
    # NSBundle 是独立 feature：用于判断当前进程是否真以本应用身份运行。
    "NSBundle",
] }
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter",
    # UNNotificationContent 已覆盖 UNMutableNotificationContent，无需单列。
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNNotificationSound",
    # willPresent 回调被 cfg(all(feature = "UNNotification", feature = "block2"))
    # 门控，缺它则「应用在前台时通知照常显示」根本无从实现。
    "UNNotification",
    "UNError",
    "block2",
] }
block2 = "0.6"

[dev-dependencies]
# 只为 tls_trust 的端到端分类测试而在：起一个本地自签 TLS 监听器，真握一次手，
# 验证 tokio-rustls 产出的 io::Error 确实能被本包这份 rustls downcast 回来。
# 手工构造的错误证明不了这一点——它绕过了"两处 rustls 必须是同一个 crate 实例"
# 这个前提，而那正是分类唯一可能静默失效的地方。
rcgen = "0.14"
# 关掉默认的 aws_lc_rs，跟生产代码一样走 ring：让测试里的 provider 与
# 真实运行时一致，否则测的就不是同一条路径了。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
