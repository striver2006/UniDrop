[package]
name = "unidrop-client"
version = "0.1.1"
description = "UniDrop Cross-Platform Native Clipboard & File Distribution Client"
edition = "2021"
authors = ["UniDrop Team"]
license = "Apache-2.0"

[lib]
name = "unidrop_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-single-instance = "2.0.0"
tauri-plugin-dialog = "2.0.0"

whoami = "1"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
crc32fast = "1.4"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
hmac = "0.12"
hex = "0.4"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSArray", "NSURL", "NSData"] }
objc2-app-kit = { version = "0.2", features = ["NSPasteboard", "NSPasteboardItem"] }
