name: Mobile CI

# 移动端（iOS / Android / 鸿蒙）的静态验证：
# - unidrop-core + FFI 层的四个交叉编译 target cargo check（防桌面 cfg 漏改
#   把移动端编译弄挂——PR 阶段暴露比发版阶段暴露便宜得多）
# - Flutter analyze + test（Dart 层）
# 真机 / 模拟器构建与签名走本地脚本（scripts/build_native_*.sh）与后续的
# 发版 workflow，这里只做每 PR 必须绿的闸门。
on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "crates/**"
      - "client-mobile/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "crates/**"
      - "client-mobile/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  cross-check:
    name: Cross-compile Check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: x86_64-linux-android
            os: ubuntu-latest
          # iOS target 需要 xcrun（ring/aws-lc-sys/libsqlite3-sys 的 build
          # script 实测会调它），Linux runner 上没有——走 macos runner。
          - target: aarch64-apple-ios
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # GitHub runner 的 NDK 在 $ANDROID_NDK_LATEST_HOME（ndk-bundle 早已不存在）；
      # CC/linker 按 target 三元组拼（x86_64 与 aarch64 前缀不同）。
      - name: Configure Android NDK (Android targets)
        if: endsWith(matrix.target, 'linux-android')
        run: |
          TRIPLE="${{ matrix.target }}"
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$NDK_BIN/${TRIPLE}24-clang"
          test -x "$CLANG" || { echo "NDK clang 不存在: $CLANG"; ls "$NDK_BIN" | head; exit 1; }
          echo "CC_$(echo "$TRIPLE" | tr '-' '_')=$CLANG" >> "$GITHUB_ENV"
          echo "AR_$(echo "$TRIPLE" | tr '-' '_')=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_$(echo "$TRIPLE" | tr 'a-z-' 'A-Z_')_LINKER=$CLANG" >> "$GITHUB_ENV"

      - name: cargo check
        run: cargo check -p unidrop-mobile-native --target ${{ matrix.target }}

  # 鸿蒙 target（aarch64-unknown-linux-ohos）需要 DevEco 的 OHOS llvm（tier-3），
  # GitHub runner 上没有官方渠道；放到 self-hosted 或本机跑：
  #   scripts/check_ohos.sh
  # 这里保留 host 单测作为核心逻辑的兜底闸门。

  core-tests:
    name: Core & FFI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test -p unidrop-core -p unidrop-mobile-native

  flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-mobile
    steps:
      - uses: actions/checkout@v4

      # Flutter 版本钉到与本地开发一致的 3.44.6：stable 浮动的 3.47 起
      # analyze 默认把 info（如 pinned share_plus 的 deprecation）判为失败，
      # 而代码为兼容鸿蒙变体（share_plus 7.0.2，无 SharePlus.instance）必须
      # 保留旧静态 API。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      # 钉死 lockfile 解析，防止 runner 上全新 resolve 漂移出本地未见过的
      # deprecation（share_plus 11.1.0 与新版 API 差异曾致 analyze 红）。
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
