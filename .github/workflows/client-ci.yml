name: Client CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "client/**"

jobs:
  build-frontend:
    name: Build Webview Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies & Build
        working-directory: client
        run: |
          pnpm install
          pnpm build

      # 托盘模板图标是生成产物。这一步钉住「脚本与产物不漂移」：漂移后若 RGB 通道
      # 非 0 或尺寸变化，症状是菜单栏图标在深色模式下不可见——不易在 review 中发现。
      # 脚本只用 Python 标准库，无需额外安装。
      - name: Verify Tray Icon Reproducibility
        working-directory: client
        run: python3 scripts/gen-tray-icon.py --check

  check-rust:
    name: Test & Build Rust Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check Rust Code
        working-directory: client/src-tauri
        run: cargo check

      - name: Run Rust Tests
        working-directory: client/src-tauri
        run: cargo test
