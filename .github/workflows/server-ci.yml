name: Server CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "server/**"

jobs:
  test-and-build:
    name: Go Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: server/go.sum

      - name: Verify Formatting (gofmt)
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted properly:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        working-directory: server
        run: go vet ./...

      - name: Run Tests with Race Detector
        working-directory: server
        run: go test -v -race ./...

      - name: Build Binary
        working-directory: server
        run: go build -v -o bin/unidrop-server ./cmd/unidrop-server
